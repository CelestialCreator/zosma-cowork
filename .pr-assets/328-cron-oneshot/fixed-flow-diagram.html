<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron one-shot fire — fixed flow (#328)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=Bricolage+Grotesque:wght@400;500;600;700&family=Fragment+Mono&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  --bg: #faf7f5;
  --surface: #ffffff;
  --surface2: #f5f0ec;
  --surface-elevated: #fff9f5;
  --border: rgba(0,0,0,0.07);
  --border-bright: rgba(0,0,0,0.14);
  --text: #292017;
  --text-dim: #8a7e72;
  --accent: #c2410c;
  --accent-dim: rgba(194,65,12,0.07);
  --green: #4d7c0f;
  --green-dim: rgba(77,124,15,0.07);
  --orange: #b45309;
  --orange-dim: rgba(180,83,9,0.07);
  --teal: #0f766e;
  --teal-dim: rgba(15,118,110,0.07);
  --plum: #9f1239;
  --plum-dim: rgba(159,18,57,0.07);
}

/* Reset */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* Animation keyframes */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeScale {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Base styles */
body {
  min-height: 100vh;
  line-height: 1.6;
}

/* Section card base */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  animation: fadeUp 0.4s ease-out both;
  animation-delay: calc(var(--i, 0) * 0.06s);
}

.section--hero {
  background: var(--surface-elevated);
  border-color: color-mix(in srgb, var(--border) 50%, var(--accent) 50%);
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  padding: 28px 32px;
}

.section--recessed {
  background: var(--surface2);
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
}

/* Section labels with dot indicators */
.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-label .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

/* Flow arrows */
.flow-arrow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 0;
  animation: fadeUp 0.4s ease-out both;
  animation-delay: calc(var(--i, 0) * 0.06s);
}

.flow-arrow svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: var(--border-bright);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Code styling */
code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--accent-dim);
  color: var(--accent);
  padding: 2px 6px;
  border-radius: 4px;
}

/* Responsive */
@media (max-width: 768px) {
  body { padding: 20px; }
  .section { padding: 16px 20px; }
  .section--hero { padding: 20px 24px; }
}


.diagram-shell {
  position: relative;
  margin-bottom: 24px;
}

.diagram-shell__hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 8px;
  opacity: 0.7;
}

.mermaid-wrap {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  min-height: 360px;
}

.mermaid-viewport {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 100%;
  min-height: 300px;
  cursor: grab;
}

.mermaid-wrap.is-panning .mermaid-viewport {
  cursor: grabbing;
  user-select: none;
}

.mermaid-canvas {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
}

.mermaid-canvas svg {
  display: block;
  max-width: none;
}

.zoom-controls {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 4px;
}

.zoom-controls button {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 14px;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, color 0.15s ease;
}

.zoom-controls button:hover {
  background: var(--border);
  color: var(--text);
}

.zoom-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  padding: 0 6px;
  white-space: nowrap;
}

.mermaid .nodeLabel {
  font-family: var(--font-body) !important;
}

.mermaid .edgeLabel {
  font-family: var(--font-mono) !important;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  padding: 40px;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 24px;
  text-wrap: balance;
}

.caption {
  color: var(--text-dim);
  font-size: 14px;
  margin-top: 16px;
  text-align: center;
}

@media (max-width: 768px) {
  body { padding: 20px; }
  h1 { font-size: 24px; }
}

</style>
</head>
<body>

<div class="container">
  <h1>Cron one-shot fire — fixed flow (#328)</h1>
  <section class="diagram-shell">
    <p class="diagram-shell__hint">
      Ctrl/Cmd + wheel to zoom. Drag to pan when zoomed. Double-click to fit.
    </p>
    <div class="mermaid-wrap" data-bg="#faf7f5">
      <div class="zoom-controls">
        <button type="button" data-action="zoom-in" title="Zoom in">+</button>
        <button type="button" data-action="zoom-out" title="Zoom out">&minus;</button>
        <button type="button" data-action="zoom-fit" title="Smart fit">&#8634;</button>
        <button type="button" data-action="zoom-one" title="1:1 zoom">1:1</button>
        <button type="button" data-action="zoom-expand" title="Open full size">&#x26F6;</button>
        <span class="zoom-label">Loading…</span>
      </div>
      <div class="mermaid-viewport">
        <div class="mermaid mermaid-canvas"></div>
      </div>
    </div>
    <script type="text/plain" class="diagram-source">
flowchart TD
  A([tick every 1s]) --> B{now >= nextRunAt?}
  B -- no --> A
  B -- yes --> C["recordRun(status: running)<br/>→ visible in Activity immediately"]
  C --> D["updateTask(lastRunAt)"]
  D --> E["onFireCallback → runTaskFire<br/>(isolated session)"]
  E --> F{model available?}
  F -- no --> G["updateRun(failed)<br/>reason: 'No model configured'"]
  F -- yes --> H["session.prompt(task.prompt)"]
  H --> I{run result}
  I -- success --> J["updateRun(completed, response, conversation)"]
  I -- error --> K["updateRun(failed, error reason)"]

  J --> L{recurring?}
  L -- one-shot --> M["removeTask(id)<br/>✅ MOVED HERE — after success only"]
  L -- recurring --> N["refreshNextRun()"]

  G --> P["KEEP task • mark lastError ⚠<br/>retry next tick / Run now"]
  K --> P

  M --> Z([Activity: completed])
  N --> Z
  P --> Z2([Activity: failed — visible, actionable])

  classDef fix fill:#0b6,stroke:#083,color:#fff;
  classDef fail fill:#c33,stroke:#900,color:#fff;
  class M fix;
  class G,K,P,Z2 fail;
    </script>
  </section>
  <p class="caption">flowchart diagram</p>
</div>


<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk/dist/mermaid-layout-elk.esm.min.mjs';

  mermaid.registerLayoutLoaders(elkLayouts);
  mermaid.initialize({
    startOnLoad: false,
    securityLevel: 'loose',
    
    theme: 'base',
    look: 'classic',
    layout: 'elk',
    themeVariables: {
      fontFamily: '\'IBM Plex Sans\', system-ui, sans-serif',
      fontSize: '16px',
      primaryColor: '#ffffff',
      primaryTextColor: '#292017',
      primaryBorderColor: '#c2410c',
      lineColor: '#8a7e72',
      secondaryColor: '#f5f0ec',
      secondaryBorderColor: '#0f766e',
      secondaryTextColor: '#292017',
      tertiaryColor: '#fff9f5',
      tertiaryBorderColor: '#b45309',
      tertiaryTextColor: '#292017',
      noteBkgColor: '#fff9f5',
      noteTextColor: '#292017',
      noteBorderColor: '#c2410c'
    },
    flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' },
    sequence: { useMaxWidth: false, diagramMarginX: 50, diagramMarginY: 10 }
  
  });

  // Expose on window so the shell JS (classic script, IIFE) can await it.
  window.mermaid = mermaid;
  window.dispatchEvent(new Event('mermaid-ready'));
</script>
<script>

(function initAllDiagrams() {
  const config = {
    fitPadding: 24,
    minHeight: 360,
    maxHeightPx: 960,
    maxHeightVh: 0.84,
    maxInitialZoom: 1.8,
    minZoom: 0.08,
    maxZoom: 6.5,
    zoomStep: 0.14,
    readabilityFloor: 0.58
  };

  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  let activeDrag = null;

  addEventListener('mousemove', (e) => activeDrag && activeDrag.onMove(e));
  addEventListener('mouseup', () => {
    if (activeDrag) activeDrag.onEnd();
    activeDrag = null;
  });

  function initDiagram(shell) {
    const wrap = shell.querySelector('.mermaid-wrap');
    const viewport = shell.querySelector('.mermaid-viewport');
    const canvas = shell.querySelector('.mermaid-canvas');
    const source = shell.querySelector('.diagram-source');
    const label = shell.querySelector('.zoom-label');
    if (!wrap || !viewport || !canvas || !source || !label) {
      console.error('visual-explainer: missing required elements in', shell);
      return;
    }

    let zoom = 1;
    let fitMode = 'contain';
    let panX = 0;
    let panY = 0;
    let svgW = 0;
    let svgH = 0;
    let sx = 0;
    let sy = 0;
    let spx = 0;
    let spy = 0;
    let touchDist = 0;
    let touchCx = 0;
    let touchCy = 0;

    function constrainPan() {
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      const rW = svgW * zoom;
      const rH = svgH * zoom;
      const pad = config.fitPadding;
      panX = (rW + pad * 2 <= vpW) ? (vpW - rW) / 2 : clamp(panX, vpW - rW - pad, pad);
      panY = (rH + pad * 2 <= vpH) ? (vpH - rH) / 2 : clamp(panY, vpH - rH - pad, pad);
    }

    function applyTransform() {
      const svg = canvas.querySelector('svg');
      if (!svg || !svgW) return;
      constrainPan();
      svg.style.width = (svgW * zoom) + 'px';
      svg.style.height = (svgH * zoom) + 'px';
      canvas.style.transform = 'translate(' + panX + 'px, ' + panY + 'px)';
      label.textContent = Math.round(zoom * 100) + '% — ' + fitMode;
    }

    function canPan() {
      const rW = svgW * zoom;
      const rH = svgH * zoom;
      return rW + config.fitPadding * 2 > viewport.clientWidth
          || rH + config.fitPadding * 2 > viewport.clientHeight;
    }

    function computeSmartFit() {
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      const aW = Math.max(80, vpW - config.fitPadding * 2);
      const aH = Math.max(80, vpH - config.fitPadding * 2);
      const contain = Math.min(aW / svgW, aH / svgH);
      let z = contain;
      let mode = 'contain';
      if (contain < config.readabilityFloor) {
        const chartR = svgH / svgW;
        const vpR = vpH / Math.max(vpW, 1);
        if (chartR >= vpR) { z = aW / svgW; mode = 'width-priority'; }
        else { z = aH / svgH; mode = 'height-priority'; }
      }
      return { zoom: clamp(z, config.minZoom, config.maxInitialZoom), mode };
    }

    function fitDiagram() {
      if (!svgW) return;
      const fit = computeSmartFit();
      zoom = fit.zoom;
      fitMode = fit.mode;
      panX = (viewport.clientWidth - svgW * zoom) / 2;
      panY = (viewport.clientHeight - svgH * zoom) / 2;
      applyTransform();
    }

    function setOneToOne() {
      zoom = clamp(1, config.minZoom, config.maxZoom);
      fitMode = '1:1';
      panX = (viewport.clientWidth - svgW * zoom) / 2;
      panY = (viewport.clientHeight - svgH * zoom) / 2;
      applyTransform();
    }

    function zoomAround(factor, cx, cy) {
      const next = clamp(zoom * factor, config.minZoom, config.maxZoom);
      const ratio = next / zoom;
      panX = cx - ratio * (cx - panX);
      panY = cy - ratio * (cy - panY);
      zoom = next;
      fitMode = 'custom';
      applyTransform();
    }

    function readSvgNaturalSize(svg) {
      let w = 0;
      let h = 0;
      if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
        w = svg.viewBox.baseVal.width;
        h = svg.viewBox.baseVal.height;
      }
      if (!w) {
        w = parseFloat(svg.getAttribute('width')) || 0;
        h = parseFloat(svg.getAttribute('height')) || 0;
      }
      if (!w) {
        try { const b = svg.getBBox(); w = b.width; h = b.height; } catch {}
      }
      if (!w) {
        const r = svg.getBoundingClientRect();
        w = r.width || 1000;
        h = r.height || 700;
      }
      if (!svg.getAttribute('viewBox')) {
        svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      }
      return { w, h };
    }

    function setAdaptiveHeight() {
      if (!svgW) return;
      const usableW = Math.max(280, wrap.getBoundingClientRect().width - 2);
      const idealH = (svgH / svgW) * usableW + config.fitPadding * 2;
      const maxVp = Math.floor(innerHeight * config.maxHeightVh);
      const hardMax = Math.min(config.maxHeightPx, Math.max(config.minHeight + 40, maxVp));
      wrap.style.height = Math.round(clamp(idealH, config.minHeight, hardMax)) + 'px';
    }

    function openInNewTab() {
      const svg = canvas.querySelector('svg');
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.style.width = '';
      clone.style.height = '';
      // Read the page background from the wrap's data-bg attribute (written
      // server-side from the current palette). This guarantees the new tab
      // matches the diagram's baked-in theme.
      const bg = wrap.getAttribute('data-bg') || '#ffffff';
      const html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'
        + '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
        + '<title>Diagram</title><style>'
        + 'body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;'
        + 'background:' + bg + ';padding:40px;box-sizing:border-box}'
        + 'svg{max-width:100%;max-height:90vh;height:auto}'
        + '</style></head><body>' + clone.outerHTML + '</body></html>';
      open(URL.createObjectURL(new Blob([html], { type: 'text/html' })), '_blank');
    }

    function waitForMermaid() {
      return new Promise((resolve, reject) => {
        if (window.mermaid && typeof window.mermaid.render === 'function') {
          resolve(window.mermaid);
          return;
        }
        const started = Date.now();
        const timer = setInterval(() => {
          if (window.mermaid && typeof window.mermaid.render === 'function') {
            clearInterval(timer);
            resolve(window.mermaid);
          } else if (Date.now() - started > 10000) {
            clearInterval(timer);
            reject(new Error('Mermaid failed to load from CDN (10s timeout)'));
          }
        }, 50);
      });
    }

    async function render() {
      try {
        const code = (source.textContent || '').trim();
        if (!code) {
          label.textContent = 'Error: empty source';
          return;
        }
        const mermaid = await waitForMermaid();
        const id = 'diagram-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        const { svg } = await mermaid.render(id, code);
        canvas.innerHTML = svg;
        const svgNode = canvas.querySelector('svg');
        if (!svgNode) {
          label.textContent = 'Error: no SVG';
          return;
        }
        const size = readSvgNaturalSize(svgNode);
        svgW = size.w;
        svgH = size.h;
        svgNode.removeAttribute('width');
        svgNode.removeAttribute('height');
        svgNode.style.maxWidth = 'none';
        svgNode.style.display = 'block';
        setAdaptiveHeight();
        fitDiagram();
      } catch (err) {
        console.error('visual-explainer mermaid render failed:', err);
        label.textContent = 'Error: ' + (err && err.message ? err.message : 'render failed');
        canvas.innerHTML = '<pre style="padding:20px;color:#b00020;white-space:pre-wrap;font-family:monospace;font-size:12px">'
          + String(err && err.message ? err.message : err).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))
          + '</pre>';
      }
    }

    const actions = {
      'zoom-in':     () => zoomAround(1 + config.zoomStep, viewport.clientWidth / 2, viewport.clientHeight / 2),
      'zoom-out':    () => zoomAround(1 / (1 + config.zoomStep), viewport.clientWidth / 2, viewport.clientHeight / 2),
      'zoom-fit':    fitDiagram,
      'zoom-one':    setOneToOne,
      'zoom-expand': openInNewTab
    };
    Object.keys(actions).forEach((action) => {
      const btn = wrap.querySelector('[data-action="' + action + '"]');
      if (btn) btn.addEventListener('click', actions[action]);
    });

    viewport.addEventListener('dblclick', fitDiagram);

    viewport.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const factor = e.deltaY < 0 ? 1 + config.zoomStep : 1 / (1 + config.zoomStep);
        zoomAround(factor, e.clientX - rect.left, e.clientY - rect.top);
        return;
      }
      if (canPan()) {
        e.preventDefault();
        panX -= e.deltaX;
        panY -= e.deltaY;
        applyTransform();
      }
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.zoom-controls') || !canPan()) return;
      wrap.classList.add('is-panning');
      sx = e.clientX;
      sy = e.clientY;
      spx = panX;
      spy = panY;
      e.preventDefault();
      activeDrag = {
        onMove: (ev) => {
          panX = spx + (ev.clientX - sx);
          panY = spy + (ev.clientY - sy);
          applyTransform();
        },
        onEnd: () => { wrap.classList.remove('is-panning'); }
      };
    });

    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        spx = panX;
        spy = panY;
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchDist = Math.sqrt(dx * dx + dy * dy);
        const r = viewport.getBoundingClientRect();
        touchCx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
        touchCy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && canPan()) {
        if (touchDist > 0) {
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          spx = panX;
          spy = panY;
          touchDist = 0;
        }
        e.preventDefault();
        panX = spx + (e.touches[0].clientX - sx);
        panY = spy + (e.touches[0].clientY - sy);
        applyTransform();
      } else if (e.touches.length === 2 && touchDist > 0) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const d = Math.sqrt(dx * dx + dy * dy);
        zoomAround(d / touchDist, touchCx, touchCy);
        touchDist = d;
      }
    }, { passive: false });

    new ResizeObserver(() => {
      if (svgW) { setAdaptiveHeight(); fitDiagram(); }
    }).observe(wrap);

    render();
  }

  function bootstrap() {
    document.querySelectorAll('.diagram-shell').forEach(initDiagram);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();

</script>

</body>
</html>
